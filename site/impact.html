<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impact — Cardiff Community Meals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="custom.css">
</head>
<body>
<a class="skip-link" href="#main" data-i18n="skip">Skip to main content</a>
<header id="site-header"></header>

<main id="main">
<section class="py-5">
  <div class="container">
    <h1 class="h2 fw-bold text-teal" data-i18n="impact.title">Our impact in Cardiff</h1>
    <p class="text-muted mb-4" style="max-width:680px;" data-i18n="impact.sub">A public, running total — so donors and businesses can see exactly what the community has achieved together.</p>
    <div class="row g-3" id="stats-grid"></div>
  </div>
</section>

<section class="py-5 bg-white">
  <div class="container">
    <h2 class="fw-bold text-teal" data-i18n="impact.leaderboard">Top contributing businesses</h2>
    <div id="leaderboard"></div>
  </div>
</section>

<section class="py-5">
  <div class="container">
    <h2 class="fw-bold text-teal" data-i18n="impact.areasTitle">Areas of Cardiff we've served</h2>
    <p class="text-muted mb-4" data-i18n="impact.areasSub">Based on requests submitted so far.</p>
    <div id="areas-list"></div>
  </div>
</section>
</main>

<footer id="site-footer" class="bg-teal-dark"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script>
CCM.renderChrome("impact.html");

function renderStats() {
  const s = CCM.impactStats();
  document.getElementById("stats-grid").innerHTML = `
    <div class="col-6 col-md-3"><div class="card text-center h-100"><div class="card-body">
      <div class="stat-num">${s.mealsDelivered}</div><div class="text-muted small">${I18N.t("stat.meals")}</div>
    </div></div></div>
    <div class="col-6 col-md-3"><div class="card text-center h-100"><div class="card-body">
      <div class="stat-num">${CCM.fmtGBP(s.totalRaised)}</div><div class="text-muted small">${I18N.t("stat.raised")}</div>
    </div></div></div>
    <div class="col-6 col-md-3"><div class="card text-center h-100"><div class="card-body">
      <div class="stat-num">${s.totalDonations}</div><div class="text-muted small">${I18N.t("stat.donations")}</div>
    </div></div></div>
    <div class="col-6 col-md-3"><div class="card text-center h-100"><div class="card-body">
      <div class="stat-num">${s.peopleHelped}</div><div class="text-muted small">${I18N.t("stat.people")}</div>
    </div></div></div>
  `;
}

function renderLeaderboard() {
  const businesses = CCM.getBusinesses();
  const donations = CCM.getDonations();
  const ranked = businesses.map(b => ({ ...b, meals: CCM.businessMealsDelivered(b.id, donations) }))
    .sort((a, b) => b.meals - a.meals);
  const max = Math.max(1, ...ranked.map(b => b.meals));

  document.getElementById("leaderboard").innerHTML = ranked.map((b, i) => `
    <div class="card mb-3"><div class="card-body">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <strong>#${i + 1} ${b.name}</strong>
        <span class="fw-bold" style="color:var(--brand-coral-deep);">${b.meals} ${I18N.t("stat.meals").toLowerCase()}</span>
      </div>
      <div class="progress" style="height:10px;"><div class="progress-bar progress-bar-coral" style="width:${Math.round((b.meals / max) * 100)}%;"></div></div>
    </div></div>
  `).join("") || `<p class="empty-state">${I18N.t("impact.noData")}</p>`;
}

function renderAreas() {
  const requests = CCM.getRequests();
  const counts = {};
  requests.forEach(r => { counts[r.area] = (counts[r.area] || 0) + 1; });
  const areas = Object.keys(counts);
  document.getElementById("areas-list").innerHTML = areas.length
    ? `<div class="row g-3">${areas.map(a => `<div class="col-md-4"><div class="card"><div class="card-body"><h3 class="h6 mb-1">${a}</h3><p class="text-muted small mb-0">${counts[a]} ${counts[a] > 1 ? I18N.t("impact.requests") : I18N.t("impact.request")}</p></div></div></div>`).join("")}</div>`
    : `<p class="empty-state">${I18N.t("impact.noData")}</p>`;
}

function renderAll() { renderStats(); renderLeaderboard(); renderAreas(); }
renderAll();
document.addEventListener("ccm:langchange", renderAll);
</script>
</body>
</html>
